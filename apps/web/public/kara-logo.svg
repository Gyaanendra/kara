<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#0F0F1A"/>

  <!-- Geometric K letterform -->
  <g transform="translate(100, 80)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="48" height="352" rx="6" fill="#6366F1"/>

    <!-- Upper diagonal arm -->
    <polygon points="48,176 280,0 320,0 320,48 80,200" fill="#6366F1"/>

    <!-- Lower diagonal arm -->
    <polygon points="48,176 80,152 320,352 320,304 80,128" fill="#818CF8"/>

    <!-- Signal node (AI accent) — center junction -->
    <circle cx="64" cy="176" r="12" fill="#A5B4FC"/>
    <circle cx="64" cy="176" r="6" fill="#E0E7FF"/>

    <!-- Signal node — upper tip -->
    <circle cx="280" cy="16" r="8" fill="#A5B4FC"/>
    <circle cx="280" cy="16" r="4" fill="#E0E7FF"/>

    <!-- Signal node — lower tip -->
    <circle cx="300" cy="336" r="8" fill="#A5B4FC"/>
    <circle cx="300" cy="336" r="4" fill="#E0E7FF"/>

    <!-- Subtle connecting lines (neural network feel) -->
    <line x1="76" y1="176" x2="272" y2="16" stroke="#A5B4FC" stroke-width="1.5" opacity="0.4"/>
    <line x1="76" y1="176" x2="292" y2="336" stroke="#A5B4FC" stroke-width="1.5" opacity="0.4"/>
    <line x1="280" y1="16" x2="300" y2="336" stroke="#A5B4FC" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- KARA wordmark -->
  <text x="256" y="490" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="42" letter-spacing="14" fill="#E0E7FF">KARA</text>
</svg>